species: crestedgecko
anchors:
- name: tail_waving_slow_meaning
  canonical_text: "Slow tail waving that signals stress; a warning display."
  aliases:
  - tail_waving_slow

- name: tail_vibration_rapid_meaning
  canonical_text: "Rapid tail vibration indicating arousal or aggression/courtship signaling."
  aliases:
  - tail_vibration_rapid

- name: territorial_marking_meaning
  canonical_text: "Male marks territory with scent secretions and tail movements."
  aliases:
  - territorial_marking

- name: distress_chirping_meaning
  canonical_text: "Short distress chirps indicating fear or discomfort."
  aliases:
  - distress_chirping

- name: barking_call_meaning
  canonical_text: "Barking-like call used for territorial or breeding signals."
  aliases:
  - barking_call

- name: head_shaking_meaning
  canonical_text: "Shakes the head to signal refusal or dislike."
  aliases:
  - head_shaking

- name: open_mouth_threat_meaning
  canonical_text: "Opens the mouth to threaten; an aggressive warning signal."
  aliases:
  - open_mouth_threat

- name: mating_bite_meaning
  canonical_text: "Male lightly bites the female to maintain the mating position."
  aliases:
  - mating_bite

- name: escape_jump_meaning
  canonical_text: "Performs a sudden escape jump when threatened."
  aliases:
  - escape_jump

- name: tail_autotomy_meaning
  canonical_text: "Drops the tail (autotomy) to distract and flee."
  aliases:
  - tail_autotomy

- name: fired_down_calm_meaning
  canonical_text: "Color lightens and movement slows; a calm 'fired-down' state."
  aliases:
  - fired_down_calm

- name: startle_chirp_meaning
  canonical_text: "Emits a startle/alarm chirp."
  aliases:
  - startle_chirp

- name: freeze_meaning
  canonical_text: "Freezes in place while remaining alert."
  aliases:
  - freeze

- name: exploration_meaning
  canonical_text: "Actively explores the surroundings."
  aliases:
  - exploration
