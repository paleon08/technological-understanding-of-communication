species: cornsnake
anchors:
- name: tail_vibration_meaning
  canonical_text: "Rapidly vibrates the tail to produce a warning sound."
  aliases:
  - tail_vibration

- name: defensive_hiss_meaning
  canonical_text: "Forcefully exhales to make a loud hiss as a threat."
  aliases:
  - defensive_hiss

- name: body_flattening_meaning
  canonical_text: "Flattens the body to appear viper-like."
  aliases:
  - body_flattening

- name: s_coil_pose_meaning
  canonical_text: "Pulls the head back into an S-shaped coil, ready to strike."
  aliases:
  - s_coil_pose

- name: bluff_strike_meaning
  canonical_text: "Performs a mock strike or actually bites."
  aliases:
  - bluff_strike

- name: musking_meaning
  canonical_text: "Releases foul-smelling musk to deter predators."
  aliases:
  - musking

- name: freezing_meaning
  canonical_text: "Freezes motion to camouflage and avoid detection."
  aliases:
  - freezing

- name: rapid_fleeing_meaning
  canonical_text: "Flees quickly to escape danger."
  aliases:
  - rapid_fleeing

- name: pheromone_trailing_meaning
  canonical_text: "Follows pheromone scent trails to locate a mate."
  aliases:
  - pheromone_trailing

- name: male_combat_meaning
  canonical_text: "Male–male combat with body entwining and wrestling."
  aliases:
  - male_combat

- name: courtship_tail_quiver_meaning
  canonical_text: "During courtship, the male rapidly quivers the tail."
  aliases:
  - courtship_tail_quiver

- name: calm_tongue_flicking_meaning
  canonical_text: "Slow tongue flicks to sample the environment."
  aliases:
  - calm_tongue_flicking
